name: Deploy main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-modal:
    name: Deploy Modal inference
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Modal CLI
        run: python -m pip install --upgrade modal
      - name: Deploy inference functions
        working-directory: Backend
        run: modal deploy modal_app.py

  deploy-backend:
    name: Deploy VPS backend
    runs-on: ubuntu-latest
    needs: deploy-modal
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Copy backend release
        run: |
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" 'mkdir -p /home/ubuntu/echo/Backend /home/ubuntu/echo/scripts /home/ubuntu/echo/deploy/vps'
          rsync -az -e 'ssh -i ~/.ssh/deploy_key' Backend/app/ "$VPS_USER@$VPS_HOST:/home/ubuntu/echo/Backend/app/"
          rsync -az -e 'ssh -i ~/.ssh/deploy_key' Backend/Dockerfile Backend/requirements-api.txt Backend/requirements-worker.txt "$VPS_USER@$VPS_HOST:/home/ubuntu/echo/Backend/"
          rsync -az -e 'ssh -i ~/.ssh/deploy_key' scripts/init-custom-datasets.sh "$VPS_USER@$VPS_HOST:/home/ubuntu/echo/scripts/"
          rsync -az -e 'ssh -i ~/.ssh/deploy_key' deploy/vps/docker-compose.yml "$VPS_USER@$VPS_HOST:/home/ubuntu/echo/deploy/vps/docker-compose.yml"
      - name: Restart backend services
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          printf 'MODAL_TOKEN_ID=%s\nMODAL_TOKEN_SECRET=%s\n' "$MODAL_TOKEN_ID" "$MODAL_TOKEN_SECRET" |
            ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" 'umask 077; cat > /home/ubuntu/echo/.env'
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" '
            set -e
            cd /home/ubuntu/echo/deploy/vps
            mkdir -p ../../Backend/uploads ../../Backend/shared-storage
            docker compose --env-file ../../.env config -q
            docker compose --env-file ../../.env up -d --build --remove-orphans
            docker compose --env-file ../../.env ps
          '
      - name: Verify VPS API health
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent "http://$VPS_HOST:8000/health"; then exit 0; fi
            sleep 5
          done
          echo "VPS API did not become healthy" >&2
          exit 1

  deploy-frontend:
    name: Build and deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci
      - name: Build static frontend
        working-directory: Frontend
        run: VITE_API_BASE_URL=/api npm run build:cloudflare
      - name: Deploy Worker and assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: Frontend
          command: deploy
